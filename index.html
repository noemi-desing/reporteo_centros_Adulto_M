        .container { max-width: 1400px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h2 { color: var(--dif-gray); border-bottom: 2px solid var(--dif-orange); padding-bottom: 10px; margin-top: 0; }
        .controls { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: 600; font-size: 12px; color: var(--dif-gray); text-transform: uppercase; }
        select, input, button { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 14px; outline: none; }
        select:focus, input:focus { border-color: var(--dif-orange); }
        button { background-color: var(--dif-orange); color: white; font-weight: 600; cursor: pointer; border: none; transition: background 0.2s; }
        button:hover { background-color: #ea580c; }
        
        .table-responsive { overflow-x: auto; max-height: 70vh; border: 1px solid var(--border-color); border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; background: #ffffff; text-align: left; }
        th, td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); font-size: 12px; }
        th { background-color: var(--dif-gray); color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 11px; text-transform: uppercase; text-align: center; position: sticky; top: 0; z-index: 10; }
        tr:hover { background-color: #f8fafc; }

        .select-concepto, .input-custom-concepto {
            width: 100%; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px; background: #fff; outline: none; font-weight: 600; color: var(--dif-gray);
        }
        .select-concepto:focus, .input-custom-concepto:focus { border-color: var(--dif-orange); background: #fff7ed; }

        .input-number {
            width: 70px; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; text-align: center; font-size: 12px;
        }
        .input-obs {
            width: 100%; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 12px;
        }
        .section-total { background-color: #f1f5f9; font-weight: bold; }
        .grand-total { background-color: #e2e8f0; font-weight: bold; font-size: 13px; }
    </style>
</head>

        let filasDinamicas = [];

        function inicializarDatos() {
            filasDinamicas = [];
            for (let tema in catalogoConceptos) {
                let subtema = catalogoConceptos[tema].subtema;
                catalogoConceptos[tema].opciones.forEach(opcion => {
                    filasDinamicas.push({
                        temaVisual: tema.replace(/ \(.*?\)/g, ''), // Limpia etiquetas internas para vista
                        subtema: subtema,
                        conceptoSeleccionado: opcion,
                        hombre: 0,
                        mujer: 0,
                        obs: ""
                    });
                });
            }
        }

        function renderizarTabla() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            let granTotalH = 0;
            let granTotalM = 0;

            let temasUnicos = Object.keys(catalogoConfigurada => catalogoConceptos);
            
            // Agrupar visualmente por Tema Principal
            let temasMap = {};
            filasDinamicas.forEach((f, idx) => {
                let key = f.temaVisual;
                if (!temasMap[key]) temasMap[key] = [];
                temasMap[key].push({ ...f, realIdx: idx });
            });

            for (let tema in temasMap) {
                let listaFilas = temasMap[tema];
                let primerFila = true;
                let temaH = 0;
                let temaM = 0;

                listaFilas.forEach(f => {
                    temaH += f.hombre;
                    temaM += f.mujer;
                    granTotalH += f.hombre;
                    granTotalM += f.mujer;

                    let tr = document.createElement('tr');
                    
                    let colTema = primerFila ? `<td rowspan="${listaFilas.length + 1}" style="font-weight: bold; vertical-align: middle; background: #fff;">${f.temaVisual}</td>` : '';
                    let colSubtema = `<td style="vertical-align: middle;">${f.subtema}</td>`;

                    // Generar opciones del select
                    let catalogoKeyOriginal = Object.keys(catalogoConceptos).find(k => k.replace(/ \(.*?\)/g, '') === f.temaVisual && catalogoConceptos[k].subtema === f.subtema);
                    // Búsqueda alternativa segura si las llaves exactas varían
                    let opcionesValidas = catalogoConceptos[tema] ? catalogoConceptos[tema].opciones : (catalogoConceptos[Object.keys(catalogoConceptos).find(k => k.startsWith(f.temaVisual))]?.opciones || []);
                    
                    let opcionesHtml = opcionesValidas.map(opt => `<option value="${opt}" ${opt === f.conceptoSeleccionado ? 'selected' : ''}>${opt}</option>`).join('');

                    tr.innerHTML = `
                        ${colTema}
                        ${colSubtema}
                        <td><select class="select-concepto" onchange="actualizarDato(${f.realIdx}, 'conceptoSeleccionado', this.value)">${opcionesHtml}</select></td>
                        <td style="text-align: center;"><input type="number" class="input-number" value="${f.hombre}" min="0" oninput="actualizarDato(${f.realIdx}, 'hombre', parseInt(this.value)||0)"></td>
                        <td style="text-align: center;"><input type="number" class="input-number" value="${f.mujer}" min="0" oninput="actualizarDato(${f.realIdx}, 'mujer', parseInt(this.value)||0)"></td>
                        <td><input type="text" class="input-obs" value="${f.obs}" oninput="actualizarDato(${f.realIdx}, 'obs', this.value)" placeholder="Detalle..."></td>
                    `;
                    tbody.appendChild(tr);
                    primerFila = false;
                });

                // Subtotal por Tema
                let trSub = document.createElement('tr');
                trSub.className = 'section-total';
                trSub.innerHTML = `
                    <td colspan="2" style="text-align: right;">Subtotal ${tema}:</td>
                    <td style="text-align: center; color: var(--dif-orange);">${temaH}</td>
                    <td style="text-align: center; color: var(--dif-orange);">${temaM}</td>
                    <td></td>
                `;
                tbody.appendChild(trSub);
            }

            // Gran Total
            let trGranTotal = document.createElement('tr');
            trGranTotal.className = 'grand-total';
            trGranTotal.innerHTML = `
                <td colspan="3" style="text-align: right;">TOTAL GENERAL DEL PERIODO:</td>
                <td style="text-align: center;">${granTotalH}</td>
                <td style="text-align: center;">${granTotalM}</td>
                <td></td>
            `;
            tbody.appendChild(trGranTotal);
        }

        function actualizarDato(index, campo, valor) {
            filasDinamicas[index][campo] = valor;
            if (campo === 'hombre' || campo === 'mujer') {
                renderizarTabla();
            }
        }

        function exportToExcel() {
            let centro = document.getElementById('selectCentro').value;
            let mes = document.getElementById('selectMes').value;
            
            let tablaClon = document.getElementById('reportTable').cloneNode(true);
            
            // Limpiar inputs interactivos del clon para dejar texto plano en Excel
            tablaClon.querySelectorAll('select').forEach(sel => {
                let parent = sel.parentNode;
                parent.textContent = sel.value;
            });
            tablaClon.querySelectorAll('input').forEach(inp => {
                let parent = inp.parentNode;
                parent.textContent = inp.value;
            });

            let html = tablaClon.outerHTML;
            let blob = new Blob(['\ufeff' + `<html><head><meta charset="utf-8"><title>Reporte Mensual</title></head><body><h3>GCAPAM - Hoja de Registro y Control</h3><p><b>Centro:</b> ${centro} <br><b>Mes Reportado:</b> ${mes}</p>` + html + '</body></html>'], {
                type: 'application/vnd.ms-excel'
            });

            let url = URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.href = url;
            a.download = `Hoja_Registro_${centro.substring(0, 15).trim().replace(/[\s\(\)\/]+/g, '_')}_${mes}.xls`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Inicializar al cargar
        window.onload = function() {
            inicializarDatos();
            renderizarTabla();
        };
    </script>
</body>
</html>
